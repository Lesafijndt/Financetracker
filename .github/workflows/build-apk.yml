                  var selectedCurr by remember { mutableStateOf(displayCurrency) }

                  AlertDialog(
                      onDismissRequest = { showEditBudgetDialog = false },
                      title = { Text("Edit Monthly Budget") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              OutlinedTextField(
                                  value = amountInput,
