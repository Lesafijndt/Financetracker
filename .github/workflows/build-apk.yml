                              }
                              Text("Type:", style = MaterialTheme.typography.labelSmall)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  listOf("EXPENSE", "TRANSFER", "INCOME").forEach { t ->
