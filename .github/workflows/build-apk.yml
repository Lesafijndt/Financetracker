name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/pulse/wallet

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PulseWallet"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.pulse.wallet"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pulse.wallet"
                  minSdk = 31
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Pulse Wallet"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WalletNotificationListener"
                      android:exported="true"
                      android:label="Pulse Wallet Live Capture"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/pulse/wallet/MainActivity.kt
          package com.pulse.wallet

          import android.app.Notification
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material.icons.filled.Edit
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.Info
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.lifecycleScope
          import androidx.room.*
          import androidx.room.migration.Migration
          import androidx.sqlite.db.SupportSQLiteDatabase
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.Flow
          import java.security.KeyStore
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.*
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import kotlin.math.abs
          import kotlin.math.roundToLong

          // ============================================================================
          // 1. PERMANENT ROOM DATABASE (NO DATE RESTRICTIONS)
          // ============================================================================

          @Entity(
              tableName = "transactions",
              indices = [Index(value = ["dedupHash"], unique = true)]
          )
          data class TransactionEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val dedupHash: String,
              val timestampMs: Long,
              val rawMerchant: String,
              val normalizedMerchant: String,
              val amountMinorUnits: Long, // Negative = Expense/Transfer Out, Positive = Income
              val currency: String,
              val cardLast4: String?,
              val category: String,
              val categorizationSource: String,
              val encryptedMetadata: String? = null,
              val sourceApp: String = "WALLET", // WALLET, MICB, OTP, CASH, MANUAL
              val txType: String = "EXPENSE"    // EXPENSE, TRANSFER, INCOME
          )

          @Entity(tableName = "merchant_rules")
          data class MerchantRuleEntity(
              @PrimaryKey val normalizedMerchant: String,
              val targetCategory: String
          )

          @Dao
          interface WalletDao {
              @Query("SELECT * FROM transactions ORDER BY timestampMs DESC")
              fun observeAllTransactions(): Flow<List<TransactionEntity>>

              @Query("SELECT * FROM transactions ORDER BY timestampMs DESC")
              suspend fun getAllTransactionsOnce(): List<TransactionEntity>

              @Query("SELECT * FROM transactions WHERE ABS(timestampMs - :timestampMs) <= 180000 AND ABS(amountMinorUnits) = :absAmount AND currency = :currency LIMIT 1")
              suspend fun findNearDuplicate(timestampMs: Long, absAmount: Long, currency: String): TransactionEntity?

              @Insert(onConflict = OnConflictStrategy.IGNORE)
              suspend fun insertTransaction(tx: TransactionEntity): Long

              @Update
              suspend fun updateTransaction(tx: TransactionEntity)

              @Delete
              suspend fun deleteTransaction(tx: TransactionEntity)

              @Query("UPDATE transactions SET category = :category, categorizationSource = 'USER_RULE' WHERE normalizedMerchant = :merchant")
              suspend fun updateCategoryForMerchant(merchant: String, category: String)

              @Query("SELECT * FROM merchant_rules WHERE normalizedMerchant = :merchant LIMIT 1")
              suspend fun findRule(merchant: String): MerchantRuleEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertRule(rule: MerchantRuleEntity)
          }

          @Database(entities = [TransactionEntity::class, MerchantRuleEntity::class], version = 2, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun dao(): WalletDao

              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null

                  private val MIGRATION_1_2 = object : Migration(1, 2) {
                      override fun migrate(db: SupportSQLiteDatabase) {
                          db.execSQL("ALTER TABLE transactions ADD COLUMN sourceApp TEXT NOT NULL DEFAULT 'WALLET'")
                          db.execSQL("ALTER TABLE transactions ADD COLUMN txType TEXT NOT NULL DEFAULT 'EXPENSE'")
                      }
                  }

                  fun get(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "pulse_wallet.db"
                          )
                              .addMigrations(MIGRATION_1_2)
                              .fallbackToDestructiveMigration()
                              .build()
                              .also { INSTANCE = it }
                      }
                  }
              }
          }

          // ============================================================================
          // 2. HARDWARE KEYSTORE ENCRYPTION & BUDGET PREFERENCES
          // ============================================================================

          object HardwareCryptoManager {
              private const val KEY_ALIAS = "pulse_hardware_aes_key"

              private fun getOrCreateKey(): SecretKey {
                  val keyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  if (!keyStore.containsAlias(KEY_ALIAS)) {
                      val keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                      val spec = KeyGenParameterSpec.Builder(
                          KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                      keyGenerator.init(spec)
                      keyGenerator.generateKey()
                  }
                  return keyStore.getKey(KEY_ALIAS, null) as SecretKey
              }

              fun encryptPayload(plainText: String): String {
                  return try {
                      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                      cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey())
                      val iv = Base64.getEncoder().encodeToString(cipher.iv)
                      val enc = Base64.getEncoder().encodeToString(cipher.doFinal(plainText.toByteArray()))
                      "$iv:$enc"
                  } catch (e: Exception) {
                      ""
                  }
              }
          }

          object BudgetPrefs {
              private const val PREFS = "pulse_budget_prefs"
              private const val KEY_LIMIT_MINOR = "budget_limit_minor"
              private const val KEY_CURRENCY = "budget_currency"
              private const val KEY_INCLUDE_TRANSFERS = "include_transfers"

              fun getBudgetMinor(context: Context): Long =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getLong(KEY_LIMIT_MINOR, 15000_00L) // Default 15,000.00 MDL

              fun setBudgetMinor(context: Context, minor: Long) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putLong(KEY_LIMIT_MINOR, minor).apply()
              }

              fun getCurrency(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_CURRENCY, "MDL") ?: "MDL"

              fun setCurrency(context: Context, currency: String) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_CURRENCY, currency).apply()
              }

              fun getIncludeTransfers(context: Context): Boolean =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean(KEY_INCLUDE_TRANSFERS, true)

              fun setIncludeTransfers(context: Context, include: Boolean) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putBoolean(KEY_INCLUDE_TRANSFERS, include).apply()
              }

              // Approximate conversion to user's primary display currency so multi-currency totals work seamlessly
              fun convertMinorToDisplay(amountMinor: Long, fromCurrency: String, toCurrency: String): Long {
                  val from = fromCurrency.uppercase()
                  val to = toCurrency.uppercase()
                  if (from == to) return amountMinor
                  val rateToMdl = when (from) {
                      "EUR" -> 19.50
                      "USD" -> 17.80
                      "RON" -> 3.92
                      "GBP" -> 22.80
                      else -> 1.0 // MDL
                  }
                  val amountInMdl = amountMinor * rateToMdl
                  val mdlToTarget = when (to) {
                      "EUR" -> 1.0 / 19.50
                      "USD" -> 1.0 / 17.80
                      "RON" -> 1.0 / 3.92
                      else -> 1.0 // MDL
                  }
                  return (amountInMdl * mdlToTarget).roundToLong()
              }
          }

          // ============================================================================
          // 3. HYBRID CATEGORIZER & TRANSFER DETECTOR
          // ============================================================================

          object HybridCategorizer {
              val CATEGORIES = listOf(
                  "Groceries",
                  "Dining & Coffee",
                  "Transport & Fuel",
                  "Transfers & P2P",
                  "Cash & ATM",
                  "Subscriptions",
                  "Shopping",
                  "Utilities",
                  "Health",
                  "Other"
              )

              fun categoryColor(category: String): Color = when (category) {
                  "Groceries" -> Color(0xFF4ECDC4)
                  "Dining & Coffee" -> Color(0xFFFFB74D)
                  "Transport & Fuel" -> Color(0xFF64B5F6)
                  "Transfers & P2P" -> Color(0xFFBA68C8)
                  "Cash & ATM" -> Color(0xFF81C784)
                  "Subscriptions" -> Color(0xFFFF8A65)
                  "Shopping" -> Color(0xFFF06292)
                  "Utilities" -> Color(0xFF4DB6AC)
                  "Health" -> Color(0xFFE57373)
                  else -> Color(0xFF90A4AE)
              }

              private val posPrefixRegex = Regex(
                  """^(SQ\s?\*|SUMUP\s?\*|PAYPAL\s?\*|GOOGLE\s?\*|TST\*\s?|POS\s+|PLATA\s+LA\s+|ACHITARE\s+|CUMPARATURA\s+|ОПЛАТА\s+|ПОКУПКА\s+)""",
                  RegexOption.IGNORE_CASE
              )
              private val trailingNoiseRegex = Regex("""(\s+#\d+|\s+\d{4,}|\s+CHISINAU.*|\s+MDA.*)$""", RegexOption.IGNORE_CASE)

              fun normalize(raw: String): String {
                  return raw.trim()
                      .replace(posPrefixRegex, "")
                      .replace(trailingNoiseRegex, "")
                      .lowercase()
                      .split(Regex("\\s+"))
                      .filter { it.isNotBlank() }
                      .joinToString(" ") { word -> word.replaceFirstChar { it.uppercase() } }
                      .ifBlank { raw.trim() }
              }

              fun detectTransactionType(rawCombined: String): String {
                  val lower = rawCombined.lowercase()
                  return when {
                      listOf("alimentare", "incasare", "primit", "пополнение", "зачисление", "received", "refund").any { it in lower } -> "INCOME"
                      listOf("transfer", "p2p", "mia ", "mia:", "перевод", "spre ", "catre ", "sent to", "card to card").any { it in lower } -> "TRANSFER"
                      else -> "EXPENSE"
                  }
              }

              suspend fun categorize(dao: WalletDao, rawMerchant: String, txType: String = "EXPENSE"): Triple<String, String, String> {
                  val normalized = normalize(rawMerchant)
                  val rule = dao.findRule(normalized)
                  if (rule != null) {
                      return Triple(normalized, rule.targetCategory, "USER_RULE")
                  }

                  if (txType == "TRANSFER") {
                      return Triple(normalized, "Transfers & P2P", "ON_DEVICE_ML")
                  }

                  val lower = normalized.lowercase()
                  val predicted = when {
                      listOf("transfer", "p2p", "mia", "перевод").any { it in lower } -> "Transfers & P2P"
                      listOf("atm", "bancomat", "retragere", "снятие", "cash").any { it in lower } -> "Cash & ATM"
                      listOf("kaufland", "linella", "nr1", "fourchette", "vellmart", "metro", "market", "grocery", "lidl", "carrefour", "piata").any { it in lower } -> "Groceries"
                      listOf("coffee", "cafe", "roasters", "starbucks", "mcdonald", "kfc", "pizza", "rest", "bistro", "andy", "placinte", "trattoria", "sushisamb", "torro", "black rabbit", "tucano", "bonjur").any { it in lower } -> "Dining & Coffee"
                      listOf("rompetrol", "lukoil", "petrom", "bemol", "vento", "tirex", "now", "uber", "bolt", "yandex", "hippo", "fuel", "gas", "parking", "parcare").any { it in lower } -> "Transport & Fuel"
                      listOf("netflix", "spotify", "youtube", "google one", "steam", "openai", "icloud", "patreon", "disney").any { it in lower } -> "Subscriptions"
                      listOf("orange", "moldcell", "moldtelecom", "starnet", "premier energy", "termoelectrica", "apa canal", "moldovagaz", "infocom").any { it in lower } -> "Utilities"
                      listOf("farmacia", "hippocrates", "felicia", "orient", "familiei", "invitro", "synevo", "medpark", "clinic", "dent", "gym", "fitness").any { it in lower } -> "Health"
                      listOf("zara", "bershka", "pull", "amazon", "aliexpress", "temu", "darwin", "ultra", "enter", "bomba", "maximum", "hiper", "jysk", "supraten").any { it in lower } -> "Shopping"
                      else -> "Other"
                  }
                  return Triple(normalized, predicted, "ON_DEVICE_ML")
              }

              suspend fun refreshSingleTransaction(dao: WalletDao, tx: TransactionEntity) {
                  val (normalized, category, source) = categorize(dao, tx.rawMerchant, tx.txType)
                  dao.updateTransaction(
                      tx.copy(
                          normalizedMerchant = normalized,
                          category = category,
                          categorizationSource = source
                      )
                  )
              }

              suspend fun refreshAllTransactions(dao: WalletDao): Int {
                  val all = dao.getAllTransactionsOnce()
                  for (tx in all) {
                      val (normalized, category, source) = categorize(dao, tx.rawMerchant, tx.txType)
                      if (tx.normalizedMerchant != normalized || tx.category != category || tx.categorizationSource != source) {
                          dao.updateTransaction(
                              tx.copy(
                                  normalizedMerchant = normalized,
                                  category = category,
                                  categorizationSource = source
                              )
                          )
                      }
                  }
                  return all.size
              }
          }

          // ============================================================================
          // 4. MULTI-APP NOTIFICATION LISTENER (GOOGLE WALLET + MOLDINDCONBANK + OTP)
          // ============================================================================

          class WalletNotificationListener : NotificationListenerService() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              companion object {
                  @Volatile
                  var instance: WalletNotificationListener? = null

                  // Matches both prefix ("€6.50", "MDL 150.00") and suffix ("150.00 MDL", "1 240,50 lei", "45.00 EUR")
                  private val PREFIX_AMOUNT_REGEX = Regex(
                      """([€$£]|USD|EUR|MDL|RON)\s*(\d{1,3}(?:[ \u00A0]?\d{3})*[.,]\d{2}|\d+)""",
                      RegexOption.IGNORE_CASE
                  )
                  private val SUFFIX_AMOUNT_REGEX = Regex(
                      """(\d{1,3}(?:[ \u00A0]?\d{3})*[.,]\d{2}|\d+)\s*(MDL|EUR|USD|RON|LEI|ЛЕЙ|€|\$|£)""",
                      RegexOption.IGNORE_CASE
                  )
                  private val LAST4_REGEX = Regex("""(?:••••|\*{2,4}|card|карта|ending in)\s*(\d{4})""", RegexOption.IGNORE_CASE)
                  private val MERCHANT_EXTRACT_REGEX = Regex(
                      """(?:la|at|to|spre|catre|в|на|মার্চेंट|merchant:?)\s+([A-Za-z0-9А-Яа-яЁё*._\-\s#]{2,35})""",
                      RegexOption.IGNORE_CASE
                  )

                  fun detectSourceApp(packageName: String, title: String, text: String): String? {
                      val pkg = packageName.lowercase()
                      val combinedTitle = "$title $text".lowercase()
                      return when {
                          pkg == "com.google.android.apps.walletnfcrel" ||
                              (pkg == "com.google.android.gms" && ("wallet" in combinedTitle || "••••" in combinedTitle)) -> "WALLET"
                          "micb" in pkg || "moldindcon" in pkg || "moldincom" in pkg ||
                              "moldindconbank" in combinedTitle || "micb" in title.lowercase() -> "MICB"
                          "otp" in pkg || "mobias" in pkg ||
                              "otp bank" in combinedTitle || "otp" in title.lowercase() -> "OTP"
                          else -> null
                      }
                  }

                  private fun normalizeCurrency(rawSym: String): String = when (rawSym.uppercase()) {
                      "€" -> "EUR"
                      "$" -> "USD"
                      "£" -> "GBP"
                      "LEI", "ЛЕЙ", "MDL" -> "MDL"
                      else -> rawSym.uppercase()
                  }

                  fun parseAmountAndCurrency(text: String): Pair<Long, String>? {
                      SUFFIX_AMOUNT_REGEX.find(text)?.let { match ->
                          val numStr = match.groupValues[1].replace(" ", "").replace("\u00A0", "").replace(",", ".")
                          val value = numStr.toDoubleOrNull() ?: return@let
                          val currency = normalizeCurrency(match.groupValues[2])
                          return Pair((value * 100).roundToLong(), currency)
                      }
                      PREFIX_AMOUNT_REGEX.find(text)?.let { match ->
                          val currency = normalizeCurrency(match.groupValues[1])
                          val numStr = match.groupValues[2].replace(" ", "").replace("\u00A0", "").replace(",", ".")
                          val value = numStr.toDoubleOrNull() ?: return@let
                          return Pair((value * 100).roundToLong(), currency)
                      }
                      return null
                  }

                  fun extractMerchantName(sourceApp: String, rawTitle: String, rawText: String): String {
                      if (sourceApp == "WALLET") return rawTitle
                      // For MICB and OTP notifications where title is often "Moldindconbank" or "OTP Bank"
                      val cleanedText = rawText.replace(Regex("""\d+[.,]\d{2}\s*(MDL|EUR|USD|LEI|ЛЕЙ)""", RegexOption.IGNORE_CASE), "").trim()
                      MERCHANT_EXTRACT_REGEX.find(rawText)?.groupValues?.getOrNull(1)?.trim()?.let { extracted ->
                          if (extracted.length >= 2) return extracted
                      }
                      val titleLower = rawTitle.lowercase()
                      if ("micb" !in titleLower && "moldindcon" !in titleLower && "otp" !in titleLower) {
                          return rawTitle
                      }
                      return cleanedText.take(36).ifBlank { "$sourceApp Transaction" }
                  }

                  suspend fun processAndStore(
                      context: Context,
                      sourceApp: String,
                      rawTitle: String,
                      rawText: String,
                      timestampMs: Long
                  ): Boolean {
                      val combined = "$rawTitle $rawText"
                      val (absAmountMinor, currency) = parseAmountAndCurrency(combined) ?: return false
                      if (absAmountMinor <= 0L) return false

                      val txType = HybridCategorizer.detectTransactionType(combined)
                      val signedAmountMinor = if (txType == "INCOME") absAmountMinor else -absAmountMinor
                      val last4 = LAST4_REGEX.find(combined)?.groupValues?.getOrNull(1)
                      val extractedMerchant = extractMerchantName(sourceApp, rawTitle, rawText)

                      val db = AppDatabase.get(context)
                      val dao = db.dao()

                      // Cross-app deduplication: if Google Wallet and MICB/OTP both notify within 3 minutes for the exact same amount
                      val nearDup = dao.findNearDuplicate(timestampMs, absAmountMinor, currency)
                      if (nearDup != null) {
                          if (nearDup.sourceApp == "WALLET" && (sourceApp == "MICB" || sourceApp == "OTP")) {
                              dao.updateTransaction(nearDup.copy(sourceApp = "${nearDup.sourceApp}+$sourceApp"))
                          }
                          return false
                      }

                      val (normalized, category, catSource) = HybridCategorizer.categorize(dao, extractedMerchant, txType)
                      val bucket = timestampMs / 180_000L
                      val dedupHash = MessageDigest.getInstance("SHA-256")
                          .digest("$bucket|$normalized|$absAmountMinor|$currency".toByteArray())
                          .joinToString("") { "%02x".format(it) }

                      val rowId = dao.insertTransaction(
                          TransactionEntity(
                              dedupHash = dedupHash,
                              timestampMs = timestampMs,
                              rawMerchant = extractedMerchant,
                              normalizedMerchant = normalized,
                              amountMinorUnits = signedAmountMinor,
                              currency = currency,
                              cardLast4 = last4,
                              category = category,
                              categorizationSource = catSource,
                              encryptedMetadata = HardwareCryptoManager.encryptPayload(combined),
                              sourceApp = sourceApp,
                              txType = txType
                          )
                      )
                      return rowId != -1L
                  }

                  suspend fun scanActiveNotificationsAndRefreshAll(context: Context): Int {
                      val db = AppDatabase.get(context)
                      val dao = db.dao()

                      instance?.let { service ->
                          try {
                              val activeList = service.activeNotifications ?: emptyArray()
                              for (sbn in activeList) {
                                  val extras = sbn.notification?.extras ?: continue
                                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString()?.trim() ?: continue
                                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.trim() ?: continue
                                  val bigText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()?.trim()
                                  val fullText = if (!bigText.isNullOrBlank()) bigText else text
                                  val source = detectSourceApp(sbn.packageName, title, fullText) ?: continue
                                  processAndStore(context, source, title, fullText, sbn.postTime)
                              }
                          } catch (_: Exception) {
                          }
                      }
                      return HybridCategorizer.refreshAllTransactions(dao)
                  }
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  instance = this
              }

              override fun onListenerDisconnected() {
                  super.onListenerDisconnected()
                  if (instance === this) instance = null
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val notification = sbn?.notification ?: return
                  val extras = notification.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString()?.trim() ?: return
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString()?.trim() ?: return
                  val bigText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()?.trim()
                  val fullText = if (!bigText.isNullOrBlank()) bigText else text

                  val sourceApp = detectSourceApp(sbn.packageName, title, fullText) ?: return

                  scope.launch {
                      processAndStore(applicationContext, sourceApp, title, fullText, sbn.postTime)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (instance === this) instance = null
                  scope.cancel()
              }
          }

