                                                                      context,
                                                                      "Refreshed ${tx.normalizedMerchant}",
                                                                      Toast.LENGTH_SHORT
                                                                  ).show()
                                                              }
                                                          }
                                                      },
                                                      modifier = Modifier.size(32.dp)
                                                  ) {
